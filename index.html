<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b5a3b">
<title>Panel Input Kinerja Harian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f5; --surface:#fff; --ink:#14212e; --muted:#64748b; --line:#e2e8ee;
  --brand:#0b5a3b; --brand-2:#177a45; --accent:#1f9d55;
  --ok:#157f4b; --ok-bg:#e6f5ec; --warn:#a16207; --warn-bg:#fdf3dc;
  --r:16px; --shadow:0 1px 2px rgba(11,60,40,.06),0 8px 24px rgba(11,60,40,.10);
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--ink);min-height:100vh;
  padding:0 0 calc(24px + env(safe-area-inset-bottom));
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid #7cc4f0;outline-offset:2px}

/* HEADER */
.hero{
  position:relative;color:#fff;overflow:hidden;isolation:isolate;
  padding:calc(22px + env(safe-area-inset-top)) 16px 88px;
  background:
    radial-gradient(circle at 12% 0%,rgba(120,220,150,.28),transparent 45%),
    radial-gradient(circle at 100% 100%,rgba(20,150,200,.28),transparent 50%),
    linear-gradient(135deg,#06402a 0%,#0b5a3b 48%,#117a47 100%);
}
/* aksen bidang miring (gema motif gedung) */
.hero::before,.hero::after{content:"";position:absolute;z-index:-1;transform:skewX(-24deg);border-radius:6px}
.hero::before{width:180px;height:260px;right:-30px;bottom:-120px;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.03))}
.hero::after{width:90px;height:260px;right:130px;bottom:-150px;background:rgba(160,235,120,.20)}
.hero .wrap{position:relative}
.hero .wrap::after{
  content:"";position:absolute;right:-20px;top:-70px;width:200px;height:200px;border-radius:50%;
  border:1px solid rgba(255,255,255,.14);box-shadow:0 0 0 22px rgba(255,255,255,.04),0 0 0 48px rgba(255,255,255,.025);
  pointer-events:none;
}
.brand{display:flex;align-items:center;gap:12px}
.brand img{
  width:60px;height:60px;border-radius:50%;background:#fff;padding:4px;flex:none;
  box-shadow:0 0 0 3px rgba(255,255,255,.28),0 6px 18px rgba(0,0,0,.3);
}
.brand .org{font-size:12px;font-weight:600;opacity:.85;margin-bottom:2px}
.wrap{max-width:560px;margin:0 auto}
.hero h1{font-size:19px;font-weight:800;letter-spacing:-.01em}
.hero p{
  display:inline-block;font-size:12.5px;font-weight:600;margin-top:16px;padding:6px 12px;border-radius:99px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(6px);
}
main{margin-top:-52px;padding:0 16px}

/* QUICK LINKS */
.links{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.link{
  background:var(--surface);border-radius:14px;padding:14px 8px;text-decoration:none;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;gap:8px;
  font-size:13px;font-weight:700;box-shadow:var(--shadow);
  transition:transform .15s,box-shadow .15s;
}
.link:hover{transform:translateY(-2px)}
.link:active{transform:scale(.97)}
.ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff}
.ico svg{width:20px;height:20px}
.i1{background:#0b5a3b}.i2{background:#1f9d55}.i3{background:#2b7fa8}

/* PROGRESS */
.progress{
  margin-top:14px;background:var(--surface);border-radius:var(--r);padding:14px 16px;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;
}
.progress .txt{flex:1}
.progress b{font-size:15px;font-weight:700}
.progress small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.bar{height:8px;background:var(--line);border-radius:99px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease}
.rekap-btn{
  padding:10px 14px;border-radius:10px;background:var(--brand);color:#fff;
  font-size:13px;font-weight:700;white-space:nowrap;
}
.rekap-btn:active{transform:scale(.97)}

/* PERSON CARD */
.card{margin-top:14px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.nav{display:flex;align-items:center;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
.nav .count{flex:1;text-align:center;font-size:13px;font-weight:600;color:var(--muted)}
.circle{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--bg)}
.circle:hover{background:#dfe7ee}
.circle svg{width:18px;height:18px}
.person{padding:22px 18px 8px;text-align:center}
.avatar{
  width:64px;height:64px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;
  background:#e2f2e8;color:var(--brand);font-weight:800;font-size:20px;
}
.name{font-size:18px;font-weight:800;letter-spacing:-.01em;line-height:1.3}
.reveal{
  margin-top:6px;font-size:12px;font-weight:600;color:var(--brand-2);
  padding:6px 10px;border-radius:8px;
}
.reveal:hover{background:#eaf5ee}

/* COPY FIELDS */
.fields{padding:12px 16px 4px;display:grid;gap:10px}
.field{
  width:100%;display:flex;align-items:center;gap:12px;text-align:left;
  padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fafcfd;
  transition:border-color .15s,background .15s;
}
.field:hover{border-color:#b8cad6;background:#fff}
.field:active{background:#f0f5f8}
.field .lbl{flex:1}
.field .lbl small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.field .lbl span{font-size:15px;font-weight:700;letter-spacing:.14em}
.field .act{font-size:12px;font-weight:700;color:var(--brand-2);display:flex;align-items:center;gap:6px}
.field .act svg{width:16px;height:16px}
.field.copied{border-color:var(--ok);background:var(--ok-bg)}
.field.copied .act{color:var(--ok)}

/* STATUS */
.status{padding:12px 16px 18px}
.state{
  display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;
  font-size:13px;font-weight:600;
}
.state svg{width:20px;height:20px;flex:none}
.state.todo{background:var(--warn-bg);color:var(--warn)}
.state.done{background:var(--ok-bg);color:var(--ok)}
.state small{display:block;font-weight:500;opacity:.85;margin-top:1px}
.cta{
  width:100%;margin-top:10px;padding:14px;border-radius:12px;font-weight:700;font-size:15px;
  background:var(--accent);color:#fff;transition:filter .15s,transform .1s;
}
.cta:hover{filter:brightness(1.07)}
.cta:active{transform:scale(.985)}
.undo{display:block;margin:10px auto 0;font-size:12px;font-weight:600;color:var(--muted);padding:6px 10px;border-radius:8px}
.undo:hover{background:var(--bg)}

/* REKAP SHEET */
.overlay{position:fixed;inset:0;background:rgba(10,24,38,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.overlay.open{display:flex}
.sheet{
  background:var(--surface);width:100%;max-width:560px;max-height:82vh;border-radius:20px 20px 0 0;
  display:flex;flex-direction:column;animation:up .22s ease;
}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet h2{font-size:16px;font-weight:800}
.sheet ul{list-style:none;padding:6px 8px calc(12px + env(safe-area-inset-bottom));overflow:auto}
.sheet li button{
  width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:11px 10px;border-radius:12px;
}
.sheet li button:hover{background:var(--bg)}
.sheet li.cur button{background:#eaf5ee}
.no{width:26px;height:26px;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);flex:none}
.sheet .nm{flex:1;font-size:14px;font-weight:600;line-height:1.3}
.chip{font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;white-space:nowrap}
.chip.done{background:var(--ok-bg);color:var(--ok)}
.chip.todo{background:var(--warn-bg);color:var(--warn)}
.chip.old{background:var(--bg);color:var(--muted)}

/* TOAST */
.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
  background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;font-weight:600;
  opacity:0;pointer-events:none;transition:.25s;z-index:30;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* ======================
   DATA
====================== */
const data = [
  {no:1, nama:"Ns. ETAWATI, S.Kep", nip:"196909301989012001", password:"Etawati1969#"},
  {no:2, nama:"YULIANA JURAIDI, A.Md.Kep", nip:"197606251998032005", password:"Juraidi1976#"},
  {no:3, nama:"RUSMULYADI, S,Kep,Ners", nip:"198212282003121005", password:"Rusmulyadi1982#"},
  {no:4, nama:"TOMMY, A.Md.Kep", nip:"198701132010011007", password:"Tommy1987#"},
  {no:5, nama:"ARDIANTO AR, A.Md.Kep", nip:"197811062008011011", password:"Ardianto1978#"},
  {no:6, nama:"AGUNG NURRIZAL, A.Md.Kep", nip:"198607042014021001", password:"Agung1986#"},
  {no:7, nama:"SISKA NURMENASARI, A.Md.Kep", nip:"198405052014022001", password:"Siska1984#"},
  {no:8, nama:"Ns. JULIANA, S.Kep.", nip:"198109192011012006", password:"Juliana#1981"},
  {no:9, nama:"TRI HERDA PERMANA SARI, A.Md.Kep", nip:"198502152010012013", password:"Herda#1985"},
  {no:10, nama:"YANA KRISTINA, S.Kep.Ners", nip:"198109142009042003", password:"Yana#1981"},
  {no:11, nama:"ERWANTO", nip:"197907152008011014", password:"Erwanto#1979"}
];

let index = 0;
let showName = false;
const $ = id => document.getElementById(id);

/* ======================
   UTIL
====================== */
function dayKey(date){
  const d = new Date(date);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function isToday(iso){ return !!iso && dayKey(iso) === dayKey(new Date()); }
function fmt(iso){
  return iso ? new Date(iso).toLocaleString("id-ID",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : "";
}
function initials(name){
  return name.replace(/[.,]/g," ").split(/\s+/).filter(w=>/^[A-Z]{2,}$/.test(w)).slice(0,2).map(w=>w[0]).join("") ||
         name.split(" ").map(x=>x[0]).join("").slice(0,2).toUpperCase();
}
function getLast(nip){ try{return localStorage.getItem("last_"+nip)}catch(e){return null} }
function setLast(nip){ try{localStorage.setItem("last_"+nip,new Date().toISOString())}catch(e){} }
function clearLast(nip){ try{localStorage.removeItem("last_"+nip)}catch(e){} }

let toastTimer;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove("show"),1600);
}

/* ======================
   ACTIONS
====================== */
function copyField(btn, text, label){
  const done = () => {
    btn.classList.add("copied");
    btn.querySelector(".act").lastChild.textContent = "Tersalin";
    toast(label+" disalin");
    setTimeout(()=>{ btn.classList.remove("copied"); btn.querySelector(".act").lastChild.textContent = "Salin"; },1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>toast("Gagal menyalin"));
  } else {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta);
    ta.select(); try{document.execCommand("copy"); done();}catch(e){toast("Gagal menyalin")} ta.remove();
  }
}
function go(step){
  index = (index + step + data.length) % data.length;
  showName = false; render();
}
function markDone(){ setLast(data[index].nip); render(); toast("Ditandai sudah input"); }
function undoDone(){ clearLast(data[index].nip); render(); }

/* ======================
   RENDER
====================== */
const svgCopy = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>';

function renderProgress(){
  const n = data.filter(d=>isToday(getLast(d.nip))).length;
  $("pText").textContent = n+" dari "+data.length+" selesai";
  $("pBar").style.width = (n/data.length*100)+"%";
}

function render(){
  const d = data[index];
  const t = getLast(d.nip);
  const today = isToday(t);

  $("app").innerHTML = `
    <div class="nav">
      <button class="circle" onclick="go(-1)" aria-label="Sebelumnya"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="count">${d.no} dari ${data.length}</div>
      <button class="circle" onclick="go(1)" aria-label="Berikutnya"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>

    <div class="person">
      <div class="avatar">${initials(d.nama)}</div>
      <div class="name">${showName ? d.nama : "Nama disembunyikan"}</div>
      <button class="reveal" onclick="showName=!showName;render()">${showName ? "Sembunyikan nama" : "Tampilkan nama"}</button>
    </div>

    <div class="fields">
      <button class="field" id="fNip">
        <span class="lbl"><small>NIP</small><span>••••••••••••••••••</span></span>
        <span class="act">${svgCopy}Salin</span>
      </button>
      <button class="field" id="fPw">
        <span class="lbl"><small>Kata sandi</small><span>••••••••••</span></span>
        <span class="act">${svgCopy}Salin</span>
      </button>
    </div>

    <div class="status">
      <div class="state ${today?"done":"todo"}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${today?'<circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/>':'<circle cx="12" cy="12" r="10"/><path d="M12 7v5l3 2"/>'}</svg>
        <div>${today ? "Sudah input hari ini" : "Belum input hari ini"}
          <small>${t ? "Terakhir input: "+fmt(t) : "Belum ada riwayat input"}</small></div>
      </div>
      ${today
        ? '<button class="undo" onclick="undoDone()">Batalkan tanda selesai</button>'
        : '<button class="cta" onclick="markDone()">Tandai sudah input</button>'}
    </div>`;

  $("fNip").onclick = e => copyField(e.currentTarget, d.nip, "NIP");
  $("fPw").onclick  = e => copyField(e.currentTarget, d.password, "Kata sandi");
  renderProgress();
}

/* ======================
   REKAP
====================== */
function renderRekap(){
  $("rekapList").innerHTML = data.map((d,i)=>{
    const t = getLast(d.nip), today = isToday(t);
    const chip = today ? `<span class="chip done">Selesai · ${new Date(t).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})}</span>`
               : t ? `<span class="chip old">${fmt(t)}</span>`
               : `<span class="chip todo">Belum</span>`;
    return `<li class="${i===index?"cur":""}"><button onclick="pick(${i})">
      <span class="no">${d.no}</span><span class="nm">${d.nama}</span>${chip}</button></li>`;
  }).join("");
}
function openRekap(){ renderRekap(); $("overlay").classList.add("open"); }
function closeRekap(){ $("overlay").classList.remove("open"); }
function pick(i){ index = i; showName = false; closeRekap(); render(); }

$("openRekap").onclick = openRekap;
$("closeRekap").onclick = closeRekap;
$("overlay").onclick = e => { if(e.target.id==="overlay") closeRekap(); };
document.addEventListener("keydown", e => {
  if(e.key==="Escape") closeRekap();
  if(!$("overlay").classList.contains("open")){
    if(e.key==="ArrowLeft") go(-1);
    if(e.key==="ArrowRight") go(1);
  }
});

/* INIT */
$("tgl").textContent = new Date().toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
render();
</script>
</body>
</html>
